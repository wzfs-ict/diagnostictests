<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer Card 2026 Aug Diagnostic Test B1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2, h3 {
            color: #2c3e50;
            text-align: center;
        }
        .student-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .info-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .info-group label {
            font-weight: bold;
            margin-right: 10px;
        }
        .info-group input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 150px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        table, tr {
            page-break-inside: avoid;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
            font-weight: bold;
            width: 250px; /* Wider for B1 descriptive headers */
            white-space: nowrap;
        }
        td {
            display: flex;
            gap: 5px;
            justify-content: flex-start; /* Align left for varying lengths */
        }
        .answer-box {
            width: 40px;
            padding: 8px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            text-transform: uppercase;
        }
        .answer-box.word {
            width: 130px;
            text-align: left;
            padding-left: 10px;
            text-transform: none;
        }
        td {
            flex-wrap: wrap;
            row-gap: 8px;
        }
        .answer-box:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 20px;
        }
        .submit-btn:hover {
            background-color: #2ecc71;
        }
        .submit-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .status-msg {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            min-height: 20px;
        }
        .status-msg.success { color: #27ae60; }
        .status-msg.error { color: #c0392b; }
        @media print {
            .status-msg { display: none; }
            body {
                background-color: #fff;
            }
            .container {
                box-shadow: none;
                padding: 0;
            }
            .submit-btn {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>B1 Answer Card</h1>
    <h2 style="font-size: 1.2em; color: #7f8c8d; margin-top: -10px;">Diagnostic Test Aug 2026</h2>

    <div class="student-info">
        <div class="info-group">
            <label for="studentName">Name:</label>
            <input type="text" id="studentName" placeholder="Full Name">
        </div>
        <div class="info-group">
            <label for="studentGrade">Grade:</label>
            <input type="text" id="studentGrade" placeholder="Grade Level">
        </div>
        <div class="info-group">
            <label for="studentScore">Score:</label>
            <input type="text" id="studentScore" placeholder="Teacher Use" disabled style="background-color: #eee;">
        </div>
    </div>

    <div>
        <h3>Grammar</h3>
        <table>
            <tr>
                <th>1 - 10</th>
                <td>
                    <input type="text" class="answer-box word" title="Question 1">
                    <input type="text" class="answer-box word" title="Question 2">
                    <input type="text" class="answer-box word" title="Question 3">
                    <input type="text" class="answer-box word" title="Question 4">
                    <input type="text" class="answer-box word" title="Question 5">
                    <input type="text" class="answer-box word" title="Question 6">
                    <input type="text" class="answer-box word" title="Question 7">
                    <input type="text" class="answer-box word" title="Question 8">
                    <input type="text" class="answer-box word" title="Question 9">
                    <input type="text" class="answer-box word" title="Question 10">
                </td>
            </tr>
            <tr>
                <th>11 - 20</th>
                <td>
                    <input type="text" class="answer-box word" title="Question 11">
                    <input type="text" class="answer-box word" title="Question 12">
                    <input type="text" class="answer-box word" title="Question 13">
                    <input type="text" class="answer-box word" title="Question 14">
                    <input type="text" class="answer-box word" title="Question 15">
                    <input type="text" class="answer-box word" title="Question 16">
                    <input type="text" class="answer-box word" title="Question 17">
                    <input type="text" class="answer-box word" title="Question 18">
                    <input type="text" class="answer-box word" title="Question 19">
                    <input type="text" class="answer-box word" title="Question 20">
                </td>
            </tr>
        </table>

        <h3>Reading Comprehension</h3>
        <table>
            <tr>
                <th>Five Notices (1-5)</th>
                <td>
                    <input type="text" class="answer-box word" title="Notice 1">
                    <input type="text" class="answer-box word" title="Notice 2">
                    <input type="text" class="answer-box word" title="Notice 3">
                    <input type="text" class="answer-box word" title="Notice 4">
                    <input type="text" class="answer-box word" title="Notice 5">
                </td>
            </tr>
            <tr>
                <th>The Great White Shark (1-6)</th>
                <td>
                    <input type="text" class="answer-box word" title="Shark 1">
                    <input type="text" class="answer-box word" title="Shark 2">
                    <input type="text" class="answer-box word" title="Shark 3">
                    <input type="text" class="answer-box word" title="Shark 4">
                    <input type="text" class="answer-box word" title="Shark 5">
                    <input type="text" class="answer-box word" title="Shark 6">
                </td>
            </tr>
            <tr>
                <th>The Tower of London (1-6)</th>
                <td>
                    <input type="text" class="answer-box word" title="Tower 1">
                    <input type="text" class="answer-box word" title="Tower 2">
                    <input type="text" class="answer-box word" title="Tower 3">
                    <input type="text" class="answer-box word" title="Tower 4">
                    <input type="text" class="answer-box word" title="Tower 5">
                    <input type="text" class="answer-box word" title="Tower 6">
                </td>
            </tr>
            <tr>
                <th>Georgina Johnson (1-5)</th>
                <td>
                    <input type="text" class="answer-box word" title="Georgina 1">
                    <input type="text" class="answer-box word" title="Georgina 2">
                    <input type="text" class="answer-box word" title="Georgina 3">
                    <input type="text" class="answer-box word" title="Georgina 4">
                    <input type="text" class="answer-box word" title="Georgina 5">
                </td>
            </tr>
            <tr>
                <th>Four Statements (1-10)</th>
                <td>
                    <input type="text" class="answer-box word" title="Statement 1">
                    <input type="text" class="answer-box word" title="Statement 2">
                    <input type="text" class="answer-box word" title="Statement 3">
                    <input type="text" class="answer-box word" title="Statement 4">
                    <input type="text" class="answer-box word" title="Statement 5">
                    <input type="text" class="answer-box word" title="Statement 6">
                    <input type="text" class="answer-box word" title="Statement 7">
                    <input type="text" class="answer-box word" title="Statement 8">
                    <input type="text" class="answer-box word" title="Statement 9">
                    <input type="text" class="answer-box word" title="Statement 10">
                </td>
            </tr>
        </table>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitForm()">Submit & Save as PDF</button>
    <div class="status-msg" id="statusMsg"></div>
</div>

<!-- Hidden iframe + real (non-AJAX) form: formsubmit.co only accepts file
     attachments on a standard multipart POST, not its AJAX endpoint. Targeting
     a hidden iframe lets that POST happen without navigating the page away. -->
<iframe name="emailFrame" id="emailFrame" style="display:none"></iframe>
<form id="emailForm" action="https://formsubmit.co/mparker@zhongshischool.org" method="POST"
      enctype="multipart/form-data" target="emailFrame" style="display:none">
    <input type="hidden" name="_cc" value="kjoshua@zhongshischool.org">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_subject" id="emailSubject">
    <input type="hidden" name="Test" value="B1 Diagnostic Test - Aug 2026">
    <input type="hidden" name="Student Name" id="emailStudentName">
    <input type="hidden" name="Grade" id="emailGrade">
    <input type="hidden" name="Submitted At" id="emailSubmittedAt">
    <input type="hidden" name="Answers" id="emailAnswers">
    <input type="file" name="attachment" id="emailAttachment">
</form>

<script>
    function collectAnswers() {
        const boxes = document.querySelectorAll('.answer-box');
        const answers = [];
        boxes.forEach(box => {
            answers.push({
                question: box.title,
                answer: (box.value || '').trim()
            });
        });
        return answers;
    }

    async function submitForm() {
        const studentName = document.getElementById('studentName').value.trim() || 'Student';
        const studentGrade = document.getElementById('studentGrade').value.trim() || '';
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');
        const pdfFilename = `B1_Diagnostic_Test_${studentName}.pdf`;

        submitBtn.disabled = true;
        statusMsg.textContent = 'Preparing PDF...';
        statusMsg.className = 'status-msg';

        // Bake current input values into the DOM so html2canvas renders what the student typed.
        document.querySelectorAll('.container input').forEach(inp => inp.setAttribute('value', inp.value));

        let pdfFile = null;
        try {
            const pdfBlob = await html2pdf().set({
                margin: 10,
                filename: pdfFilename,
                image: { type: 'jpeg', quality: 0.85 },
                html2canvas: { scale: 1.5 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['avoid-all', 'css'] }
            }).from(document.querySelector('.container')).outputPdf('blob');
            pdfFile = new File([pdfBlob], pdfFilename, { type: 'application/pdf' });
        } catch (e) {
            console.error('Could not generate PDF for email attachment:', e);
        }

        document.getElementById('emailSubject').value = `B1 Diagnostic Test submission - ${studentName}`;
        document.getElementById('emailStudentName').value = studentName;
        document.getElementById('emailGrade').value = studentGrade;
        document.getElementById('emailSubmittedAt').value = new Date().toLocaleString();
        document.getElementById('emailAnswers').value = collectAnswers()
            .map(a => `${a.question}: ${a.answer || '(blank)'}`)
            .join('\n');

        const attachmentInput = document.getElementById('emailAttachment');
        if (pdfFile) {
            const dt = new DataTransfer();
            dt.items.add(pdfFile);
            attachmentInput.files = dt.files;
        }

        statusMsg.textContent = 'Sending to teacher...';
        const emailFrame = document.getElementById('emailFrame');
        emailFrame.addEventListener('load', () => {
            statusMsg.textContent = 'Sent to teacher ✓';
            statusMsg.className = 'status-msg success';
            submitBtn.disabled = false;
        }, { once: true });
        try {
            document.getElementById('emailForm').submit();
        } catch (e) {
            console.error('Could not send results automatically:', e);
            statusMsg.textContent = 'Could not send automatically — please also save/print this page and hand it in.';
            statusMsg.className = 'status-msg error';
            submitBtn.disabled = false;
        }

        // Change document title for cleaner PDF saving
        document.title = `B1_Diagnostic_Test_${studentName}`;
        window.print();
        // Reset title after a brief delay
        setTimeout(() => { document.title = 'Answer Card 2026 Aug Diagnostic Test B1'; }, 1000);
    }
</script>

</body>
</html>
