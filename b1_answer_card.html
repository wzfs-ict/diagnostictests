<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer Card 2026 Aug Diagnostic Test B1</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2, h3 {
            color: #2c3e50;
            text-align: center;
        }
        .student-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .info-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .info-group label {
            font-weight: bold;
            margin-right: 10px;
        }
        .info-group input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 150px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
            font-weight: bold;
            width: 250px; /* Wider for B1 descriptive headers */
            white-space: nowrap;
        }
        td {
            display: flex;
            gap: 5px;
            justify-content: flex-start; /* Align left for varying lengths */
        }
        .answer-box {
            width: 40px;
            padding: 8px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            text-transform: uppercase;
        }
        .answer-box:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 20px;
        }
        .submit-btn:hover {
            background-color: #2ecc71;
        }
        .submit-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .status-msg {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            min-height: 20px;
        }
        .status-msg.success { color: #27ae60; }
        .status-msg.error { color: #c0392b; }
        @media print {
            .status-msg { display: none; }
            body {
                background-color: #fff;
            }
            .container {
                box-shadow: none;
                padding: 0;
            }
            .submit-btn {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>B1 Answer Card</h1>
    <h2 style="font-size: 1.2em; color: #7f8c8d; margin-top: -10px;">Diagnostic Test Aug 2026</h2>

    <div class="student-info">
        <div class="info-group">
            <label for="studentName">Name:</label>
            <input type="text" id="studentName" placeholder="Full Name">
        </div>
        <div class="info-group">
            <label for="studentGrade">Grade:</label>
            <input type="text" id="studentGrade" placeholder="Grade Level">
        </div>
        <div class="info-group">
            <label for="studentScore">Score:</label>
            <input type="text" id="studentScore" placeholder="Teacher Use" disabled style="background-color: #eee;">
        </div>
    </div>

    <div>
        <h3>Grammar</h3>
        <table>
            <tr>
                <th>1 - 10</th>
                <td>
                    <input type="text" class="answer-box" maxlength="1" title="Question 1">
                    <input type="text" class="answer-box" maxlength="1" title="Question 2">
                    <input type="text" class="answer-box" maxlength="1" title="Question 3">
                    <input type="text" class="answer-box" maxlength="1" title="Question 4">
                    <input type="text" class="answer-box" maxlength="1" title="Question 5">
                    <input type="text" class="answer-box" maxlength="1" title="Question 6">
                    <input type="text" class="answer-box" maxlength="1" title="Question 7">
                    <input type="text" class="answer-box" maxlength="1" title="Question 8">
                    <input type="text" class="answer-box" maxlength="1" title="Question 9">
                    <input type="text" class="answer-box" maxlength="1" title="Question 10">
                </td>
            </tr>
            <tr>
                <th>11 - 20</th>
                <td>
                    <input type="text" class="answer-box" maxlength="1" title="Question 11">
                    <input type="text" class="answer-box" maxlength="1" title="Question 12">
                    <input type="text" class="answer-box" maxlength="1" title="Question 13">
                    <input type="text" class="answer-box" maxlength="1" title="Question 14">
                    <input type="text" class="answer-box" maxlength="1" title="Question 15">
                    <input type="text" class="answer-box" maxlength="1" title="Question 16">
                    <input type="text" class="answer-box" maxlength="1" title="Question 17">
                    <input type="text" class="answer-box" maxlength="1" title="Question 18">
                    <input type="text" class="answer-box" maxlength="1" title="Question 19">
                    <input type="text" class="answer-box" maxlength="1" title="Question 20">
                </td>
            </tr>
        </table>

        <h3>Reading Comprehension</h3>
        <table>
            <tr>
                <th>Five Notices (1-5)</th>
                <td>
                    <input type="text" class="answer-box" maxlength="1" title="Notice 1">
                    <input type="text" class="answer-box" maxlength="1" title="Notice 2">
                    <input type="text" class="answer-box" maxlength="1" title="Notice 3">
                    <input type="text" class="answer-box" maxlength="1" title="Notice 4">
                    <input type="text" class="answer-box" maxlength="1" title="Notice 5">
                </td>
            </tr>
            <tr>
                <th>The Great White Shark (1-6)</th>
                <td>
                    <input type="text" class="answer-box" maxlength="1" title="Shark 1">
                    <input type="text" class="answer-box" maxlength="1" title="Shark 2">
                    <input type="text" class="answer-box" maxlength="1" title="Shark 3">
                    <input type="text" class="answer-box" maxlength="1" title="Shark 4">
                    <input type="text" class="answer-box" maxlength="1" title="Shark 5">
                    <input type="text" class="answer-box" maxlength="1" title="Shark 6">
                </td>
            </tr>
            <tr>
                <th>The Tower of London (1-6)</th>
                <td>
                    <input type="text" class="answer-box" maxlength="1" title="Tower 1">
                    <input type="text" class="answer-box" maxlength="1" title="Tower 2">
                    <input type="text" class="answer-box" maxlength="1" title="Tower 3">
                    <input type="text" class="answer-box" maxlength="1" title="Tower 4">
                    <input type="text" class="answer-box" maxlength="1" title="Tower 5">
                    <input type="text" class="answer-box" maxlength="1" title="Tower 6">
                </td>
            </tr>
            <tr>
                <th>Georgina Johnson (1-5)</th>
                <td>
                    <input type="text" class="answer-box" maxlength="1" title="Georgina 1">
                    <input type="text" class="answer-box" maxlength="1" title="Georgina 2">
                    <input type="text" class="answer-box" maxlength="1" title="Georgina 3">
                    <input type="text" class="answer-box" maxlength="1" title="Georgina 4">
                    <input type="text" class="answer-box" maxlength="1" title="Georgina 5">
                </td>
            </tr>
            <tr>
                <th>Four Statements (1-10)</th>
                <td>
                    <input type="text" class="answer-box" maxlength="1" title="Statement 1">
                    <input type="text" class="answer-box" maxlength="1" title="Statement 2">
                    <input type="text" class="answer-box" maxlength="1" title="Statement 3">
                    <input type="text" class="answer-box" maxlength="1" title="Statement 4">
                    <input type="text" class="answer-box" maxlength="1" title="Statement 5">
                    <input type="text" class="answer-box" maxlength="1" title="Statement 6">
                    <input type="text" class="answer-box" maxlength="1" title="Statement 7">
                    <input type="text" class="answer-box" maxlength="1" title="Statement 8">
                    <input type="text" class="answer-box" maxlength="1" title="Statement 9">
                    <input type="text" class="answer-box" maxlength="1" title="Statement 10">
                </td>
            </tr>
        </table>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitForm()">Submit & Save as PDF</button>
    <div class="status-msg" id="statusMsg"></div>
</div>

<script>
    // Paste the "HTTP POST URL" from your Power Automate flow's trigger here.
    // Leave it as-is (starting with "PASTE_") to skip emailing and just print/save as before.
    const FLOW_URL = "PASTE_YOUR_POWER_AUTOMATE_URL_HERE";

    function collectAnswers() {
        const boxes = document.querySelectorAll('.answer-box');
        const answers = [];
        boxes.forEach(box => {
            answers.push({
                question: box.title,
                answer: (box.value || '').trim().toUpperCase()
            });
        });
        return answers;
    }

    async function submitForm() {
        const studentName = document.getElementById('studentName').value.trim() || 'Student';
        const studentGrade = document.getElementById('studentGrade').value.trim() || '';
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');

        const payload = {
            test: 'B1 Diagnostic Test - Aug 2026',
            studentName: studentName,
            studentGrade: studentGrade,
            submittedAt: new Date().toISOString(),
            answers: collectAnswers()
        };

        if (FLOW_URL && FLOW_URL.startsWith('http')) {
            submitBtn.disabled = true;
            statusMsg.textContent = 'Sending to teacher...';
            statusMsg.className = 'status-msg';
            try {
                await fetch(FLOW_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Power Automate HTTP triggers don't send CORS headers by default
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                statusMsg.textContent = 'Sent to teacher ✓';
                statusMsg.className = 'status-msg success';
            } catch (e) {
                console.error('Could not send results automatically:', e);
                statusMsg.textContent = 'Could not send automatically — please also save/print this page and hand it in.';
                statusMsg.className = 'status-msg error';
            } finally {
                submitBtn.disabled = false;
            }
        }

        // Change document title for cleaner PDF saving
        document.title = `B1_Diagnostic_Test_${studentName}`;
        window.print();
        // Reset title after a brief delay
        setTimeout(() => { document.title = 'Answer Card 2026 Aug Diagnostic Test B1'; }, 1000);
    }
</script>

</body>
</html>
