<!DOCTYPE html>

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2, h3 {
            color: #2c3e50;
            text-align: center;
        }
        .student-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .info-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .info-group label {
            font-weight: bold;
            margin-right: 10px;
        }
        .info-group input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 150px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        table, tr {
            page-break-inside: avoid;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
            font-weight: bold;
            width: 250px; /* Wider for B1 descriptive headers */
            white-space: nowrap;
        }
        td {
            display: flex;
            gap: 5px;
            justify-content: flex-start; /* Align left for varying lengths */
        }
        .answer-box {
            width: 40px;
            padding: 8px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            text-transform: uppercase;
        }
        .answer-box.word {
            width: 130px;
            text-align: left;
            padding-left: 10px;
            text-transform: none;
        }
        td {
            flex-wrap: wrap;
            row-gap: 8px;
        }
        .answer-box:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }
        .answer-box.correct {
            border-color: #27ae60;
            background-color: #eafaf1;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .answer-box.incorrect {
            border-color: #c0392b;
            background-color: #fdecea;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 20px;
        }
        .submit-btn:hover {
            background-color: #2ecc71;
        }
        .submit-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .status-msg {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            min-height: 20px;
        }
        .status-msg.success { color: #27ae60; }
        .status-msg.error { color: #c0392b; }
        @media print {
            .status-msg { display: none; }
            body {
                background-color: #fff;
            }
            .container {
                box-shadow: none;
                padding: 0;
            }
            .submit-btn {
                display: none;
            }
        }
    </style>
</head>

    async function sha256Hex(text) {
        const data = new TextEncoder().encode(text);
        const digest = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function collectAnswers() {
        const boxes = document.querySelectorAll('.answer-box');
        const answers = [];
        boxes.forEach(box => {
            answers.push({
                question: box.title,
                answer: (box.value || '').trim()
            });
        });
        return answers;
    }

    // Hashes each typed answer and compares it to the answer key, marking each box
    // correct/incorrect. Returns null if grading isn't possible (e.g. Web Crypto
    // unavailable), so callers can fall back to leaving the score blank.
    async function gradeAnswers() {
        const boxes = document.querySelectorAll('.answer-box');
        let correct = 0;
        let total = 0;
        try {
            for (const box of boxes) {
                const key = ANSWER_KEY_HASHES[box.title];
                if (!key) continue;
                total++;
                box.classList.remove('correct', 'incorrect');
                const normalized = `${box.title}::${(box.value || '').trim().toLowerCase()}`;
                const isCorrect = (await sha256Hex(normalized)) === key;
                box.classList.add(isCorrect ? 'correct' : 'incorrect');
                if (isCorrect) correct++;
            }
        } catch (e) {
            console.error('Could not auto-mark the test:', e);
            return null;
        }
        return { correct, total };
    }

    async function submitForm() {
        const studentName = document.getElementById('studentName').value.trim() || 'Student';
        const studentGrade = document.getElementById('studentGrade').value.trim() || '';
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');
        const pdfFilename = `B1_Diagnostic_Test_${studentName}.pdf`;

        submitBtn.disabled = true;
        statusMsg.textContent = 'Marking...';
        statusMsg.className = 'status-msg';

        const result = await gradeAnswers();
        const scoreText = result ? `${result.correct} / ${result.total}` : '';
        document.getElementById('studentScore').value = scoreText;

        statusMsg.textContent = 'Preparing PDF...';

        // Bake current input values into the DOM so html2canvas renders what the student typed.
        document.querySelectorAll('.container input').forEach(inp => inp.setAttribute('value', inp.value));

        let pdfFile = null;
        try {
            const pdfBlob = await html2pdf().set({
                margin: 10,
                filename: pdfFilename,
                image: { type: 'jpeg', quality: 0.85 },
                html2canvas: { scale: 1.5 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['avoid-all', 'css'] }
            }).from(document.querySelector('.container')).outputPdf('blob');
            pdfFile = new File([pdfBlob], pdfFilename, { type: 'application/pdf' });
        } catch (e) {
            console.error('Could not generate PDF for email attachment:', e);
        }

        document.getElementById('emailSubject').value = `B1 Diagnostic Test submission - ${studentName}${scoreText ? ` (${scoreText})` : ''}`;
        document.getElementById('emailStudentName').value = studentName;
        document.getElementById('emailGrade').value = studentGrade;
        document.getElementById('emailScore').value = scoreText;
        document.getElementById('emailSubmittedAt').value = new Date().toLocaleString();
        document.getElementById('emailAnswers').value = collectAnswers()
            .map(a => `${a.question}: ${a.answer || '(blank)'}`)
            .join('\n');

        const attachmentInput = document.getElementById('emailAttachment');
        if (pdfFile) {
            const dt = new DataTransfer();
            dt.items.add(pdfFile);
            attachmentInput.files = dt.files;
        }

        statusMsg.textContent = 'Sending to teacher...';
        const emailFrame = document.getElementById('emailFrame');
        emailFrame.addEventListener('load', () => {
            statusMsg.textContent = 'Sent to teacher ✓';
            statusMsg.className = 'status-msg success';
            submitBtn.disabled = false;
        }, { once: true });
        try {
            document.getElementById('emailForm').submit();
        } catch (e) {
            console.error('Could not send results automatically:', e);
            statusMsg.textContent = 'Could not send automatically — please also save/print this page and hand it in.';
            statusMsg.className = 'status-msg error';
            submitBtn.disabled = false;
        }

        // Change document title for cleaner PDF saving
        document.title = `B1_Diagnostic_Test_${studentName}`;
        window.print();
        // Reset title after a brief delay
        setTimeout(() => { document.title = 'Answer Card 2026 Aug Diagnostic Test B1'; }, 1000);
    }
