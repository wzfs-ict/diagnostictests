<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer Card 2026 Aug Diagnostic Test A2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2, h3 {
            color: #2c3e50;
            text-align: center;
        }
        .student-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .info-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .info-group label {
            font-weight: bold;
            margin-right: 10px;
        }
        .info-group input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 150px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
            font-weight: bold;
            width: 150px;
            white-space: nowrap;
        }
        td {
            display: flex;
            gap: 5px;
            justify-content: space-around;
        }
        .answer-box {
            width: 40px;
            padding: 8px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            text-transform: uppercase;
        }
        .answer-box:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 20px;
        }
        .submit-btn:hover {
            background-color: #2ecc71;
        }
        @media print {
            body {
                background-color: #fff;
            }
            .container {
                box-shadow: none;
                padding: 0;
            }
            .submit-btn {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <h2 style="font-size: 1.2em; color: #7f8c8d; margin-top: -10px;">Diagnostic Test Aug 2026</h2>

    <button class="submit-btn" onclick="submitForm()">Save as PDF / Submit</button>
</div>

<script>
    function submitForm() {
        // Change document title for cleaner PDF saving
        const studentName = document.getElementById('studentName').value || 'Student';
        document.title = `A2_Diagnostic_Test_${studentName}`;
        window.print();
        // Reset title after a brief delay
        setTimeout(() => { document.title = 'Answer Card 2026 Aug Diagnostic Test A2'; }, 1000);
    }
</script>
