<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 8 Unit 1 Answer Card</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      line-height: 1.6;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1, h2, h3 {
      color: #2c3e50;
      text-align: center;
    }
    .student-info {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin: 20px 0 30px;
      flex-wrap: wrap;
    }
    .info-group {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .info-group label {
      font-weight: bold;
      margin-right: 10px;
    }
    .info-group input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 170px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }
    th {
      background-color: #f8f9fa;
      width: 140px;
      white-space: nowrap;
    }
    td {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-start;
      row-gap: 8px;
    }
    .answer-box {
      width: 42px;
      padding: 8px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      text-transform: uppercase;
    }
    .answer-box.long {
      width: 130px;
      text-align: left;
      padding-left: 10px;
      text-transform: none;
    }
    .answer-box:focus {
      border-color: #3498db;
      outline: none;
      box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
    }
    .submit-btn {
      display: block;
      width: 100%;
      padding: 15px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 20px;
    }
    .submit-btn:hover {
      background-color: #2ecc71;
    }
    .submit-btn:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
    }
    .status-msg {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
      min-height: 20px;
    }
    .status-msg.success { color: #27ae60; }
    .status-msg.error { color: #c0392b; }
    @media print {
      body { background-color: #fff; }
      .container { box-shadow: none; padding: 0; }
      .submit-btn, .status-msg { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Grade 8 Unit 1</h1>
    <h2 style="font-size: 1.2em; color: #7f8c8d; margin-top: -10px;">Answer Card</h2>

    <div class="student-info">
      <div class="info-group">
        <label for="studentName">Name:</label>
        <input type="text" id="studentName" placeholder="Full Name">
      </div>
      <div class="info-group">
        <label for="studentGrade">Grade:</label>
        <input type="text" id="studentGrade" value="8" placeholder="Grade Level">
      </div>
      <div class="info-group">
        <label for="studentScore">Score:</label>
        <input type="text" id="studentScore" placeholder="Teacher Use" disabled style="background-color: #eee;">
      </div>
    </div>

    <div>
      <h3>Part A - Multiple Choice</h3>
      <table>
        <tr>
          <th>1 - 10</th>
          <td>
            <input type="text" class="answer-box" title="Question 1">
            <input type="text" class="answer-box" title="Question 2">
            <input type="text" class="answer-box" title="Question 3">
            <input type="text" class="answer-box" title="Question 4">
            <input type="text" class="answer-box" title="Question 5">
            <input type="text" class="answer-box" title="Question 6">
            <input type="text" class="answer-box" title="Question 7">
            <input type="text" class="answer-box" title="Question 8">
            <input type="text" class="answer-box" title="Question 9">
            <input type="text" class="answer-box" title="Question 10">
          </td>
        </tr>
        <tr>
          <th>11 - 20</th>
          <td>
            <input type="text" class="answer-box" title="Question 11">
            <input type="text" class="answer-box" title="Question 12">
            <input type="text" class="answer-box" title="Question 13">
            <input type="text" class="answer-box" title="Question 14">
            <input type="text" class="answer-box" title="Question 15">
            <input type="text" class="answer-box" title="Question 16">
            <input type="text" class="answer-box" title="Question 17">
            <input type="text" class="answer-box" title="Question 18">
            <input type="text" class="answer-box" title="Question 19">
            <input type="text" class="answer-box" title="Question 20">
          </td>
        </tr>
      </table>

      <h3>Part B - Short Answers</h3>
      <table>
        <tr>
          <th>21 - 30</th>
          <td>
            <input type="text" class="answer-box long" title="Question 21">
            <input type="text" class="answer-box long" title="Question 22">
            <input type="text" class="answer-box long" title="Question 23">
            <input type="text" class="answer-box long" title="Question 24">
            <input type="text" class="answer-box long" title="Question 25">
            <input type="text" class="answer-box long" title="Question 26">
            <input type="text" class="answer-box long" title="Question 27">
            <input type="text" class="answer-box long" title="Question 28">
            <input type="text" class="answer-box long" title="Question 29">
            <input type="text" class="answer-box long" title="Question 30">
          </td>
        </tr>
      </table>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="saveAsPdf()">Submit & Save as PDF</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <script>
    async function saveAsPdf() {
      const studentName = document.getElementById('studentName').value.trim() || 'Student';
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');

      submitBtn.disabled = true;
      statusMsg.textContent = 'Preparing PDF...';
      statusMsg.className = 'status-msg';

      try {
        await html2pdf().set({
          margin: 10,
          filename: `Grade8_Unit1_${studentName}.pdf`,
          image: { type: 'jpeg', quality: 0.85 },
          html2canvas: { scale: 1.5 },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['avoid-all', 'css'] }
        }).from(document.querySelector('.container')).save();

        statusMsg.textContent = 'PDF ready ✓';
        statusMsg.className = 'status-msg success';
      } catch (error) {
        console.error(error);
        statusMsg.textContent = 'Could not generate PDF. Please print the page directly.';
        statusMsg.className = 'status-msg error';
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
